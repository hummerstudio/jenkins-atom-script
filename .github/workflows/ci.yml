name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Three platforms because the atom runs three families of interpreters: sh on unix, cmd/powershell on windows,
# and python/node everywhere. A macOS-only smoke cannot honestly claim bat works.
jobs:
  atom:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@v4
        with:
          repository: hummerstudio/jenkins-atom-sdk
          path: jenkins-atom-sdk
      - name: Build the SDK
        working-directory: jenkins-atom-sdk
        run: mvn -B -ntp -q package -DskipTests
      - name: Build and smoke test the atom
        shell: bash
        run: ./tools/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: script-atom-${{ matrix.os }}
          path: dist/script/
